[package]
name = "wlr"
version = "1.1.0"
edition = "2024"

[profile.release]
opt-level = 'z'     # Optimize for size (z or s)
lto = true          # Enable Link Time Optimization (huge help)
codegen-units = 1   # Reduce parallel code generation for better optimization
panic = 'abort'     # Remove stack unwinding code (saves space)
strip = true        # Automatically strip symbols and debug info

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rand = "0.9.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
